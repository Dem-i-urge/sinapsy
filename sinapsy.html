<style>
/* Раскладка: карта-астролябия владельца. Сферы — секторы кольца, точки ставит и двигает он сам,
   связи рисует он сам. Справа пульт; Notion здесь не читается — сверку делает Архитектор. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --ink:#1a2030; --muted:#5b6476; --line:#d5dae3;
  --field:#f8f6f1; --orbit:#e3ded2; --halo:#f8f6f1;
  --impulse:#c4660a; --impulse-soft:#f7e2c6; --on-impulse:#ffffff;
  --done:#2d7a68; --done-soft:#d6ebe4; --late:#b8372f; --late-soft:#f6dad7;
  --star:#1f2a44;
  --s1:#8a5a9e; --s2:#2f7f8c; --s3:#a8692b; --s4:#4f7a3a; --s5:#b2475e; --s6:#3f62a8; --s7:#7a6a2a; --s8:#6b5bb5; --s9:#2f8a62; --s10:#a04b2c;
  --f-display:"Yeseva One", Georgia, "Times New Roman", serif;
  --f-ui:"Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-data:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1118; --surface:#151b26; --ink:#e6e8ee; --muted:#97a0b2; --line:#283041;
  --field:#0f1622; --orbit:#1f2a3b; --halo:#0f1622;
  --impulse:#f2a640; --impulse-soft:#3a2912; --on-impulse:#0d1118;
  --done:#5cbca3; --done-soft:#16302a; --late:#f07a6e; --late-soft:#3a1c1a;
  --star:#e9edf7;
  --s1:#c79ad8; --s2:#6cc3cf; --s3:#e0a566; --s4:#93c67b; --s5:#e98aa0; --s6:#8fb0f0; --s7:#d4c27a; --s8:#a99cf0; --s9:#6fd0a4; --s10:#e8906c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1118; --surface:#151b26; --ink:#e6e8ee; --muted:#97a0b2; --line:#283041;
  --field:#0f1622; --orbit:#1f2a3b; --halo:#0f1622;
  --impulse:#f2a640; --impulse-soft:#3a2912; --on-impulse:#0d1118;
  --done:#5cbca3; --done-soft:#16302a; --late:#f07a6e; --late-soft:#3a1c1a;
  --star:#e9edf7;
  --s1:#c79ad8; --s2:#6cc3cf; --s3:#e0a566; --s4:#93c67b; --s5:#e98aa0; --s6:#8fb0f0; --s7:#d4c27a; --s8:#a99cf0; --s9:#6fd0a4; --s10:#e8906c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;
  display:flex;flex-direction:column;gap:10px;min-height:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
h1{font:400 28px/1 var(--f-display);margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px;min-width:0}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
select,button,input[type=text],input[type=url],textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
textarea{resize:vertical;min-height:56px;width:100%}
input[type=text],input[type=url]{width:100%}
button{cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--impulse);outline-offset:2px}
button.primary{background:var(--impulse);border-color:var(--impulse);color:var(--on-impulse);font-weight:500}
button.quiet{background:transparent}
button.danger{color:var(--late);border-color:var(--late)}
button[aria-pressed="true"]{border-color:var(--impulse);color:var(--impulse)}
button[disabled]{opacity:.5;cursor:default}
.strip{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:baseline;font-size:13px;color:var(--muted)}
.strip b{font:500 17px/1 var(--f-data);font-variant-numeric:tabular-nums;color:var(--ink);margin-right:5px}
.strip .rich b{color:var(--impulse)} .strip .ok b{color:var(--done)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;flex:1;min-height:600px}
@media (max-width:900px){.main{grid-template-columns:1fr}.field{min-height:520px}}
.field{position:relative;background:var(--field);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.field svg{display:block;width:100%;height:100%;touch-action:none}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--impulse);color:var(--on-impulse);font-size:13px;padding:5px 12px;border-radius:999px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 20px)}
.banner[hidden]{display:none}
.banner button{font-size:12px;padding:1px 8px;background:transparent;color:inherit;border-color:currentColor}
.keys{position:absolute;left:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--muted);pointer-events:none;max-width:calc(100% - 20px)}
.keys svg{width:12px;height:12px;vertical-align:-2px;margin-right:4px;display:inline-block}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto;max-height:84vh}
.side h2{font:500 12px/1.3 var(--f-ui);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0}
.side h3{font:600 18px/1.3 var(--f-ui);margin:0;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.done{background:var(--done-soft);color:var(--done)} .chip.late{background:var(--late-soft);color:var(--late)} .chip.run{background:var(--impulse-soft);color:var(--impulse)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer}
.chips input{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm{border:1px dashed var(--impulse);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.form{display:flex;flex-direction:column;gap:8px;font-size:13px}
.form label.t{color:var(--muted);font-size:12px}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:6px;align-items:center}
.list li button.go{flex:1;min-width:0;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}
.list li button.go span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin:0}
.msg{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--bg)}
.msg.err{background:var(--late-soft);color:var(--late)} .msg.ok{background:var(--done-soft);color:var(--done)}
.err-inline{color:var(--late);font-size:13px}
a{color:var(--impulse)}
/* карта */
.orbit{fill:none;stroke:var(--orbit);stroke-width:1}
.sector{stroke:var(--orbit);stroke-width:1;stroke-dasharray:2 6}
.sph-name{font:400 17px var(--f-display);paint-order:stroke;stroke:var(--halo);stroke-width:4px}
.n-label{font:600 12.5px var(--f-ui);fill:var(--ink);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px}
.n-label.done{fill:var(--muted);font-weight:500}
.edge{stroke:var(--muted);stroke-width:1.2;opacity:.55}
.edge.rich{stroke:var(--impulse);stroke-width:1.8;opacity:.9}
.center-hint{font:400 20px var(--f-display);fill:var(--muted)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.45}}
</style>

<header class="top">
  <div class="brand">
    <h1>Синапсы</h1>
    <div class="sub" id="sub">Своя карта: крупные точки по сферам. Отметки сверяются с Notion.</div>
  </div>
  <div class="ctrl">
    <button class="primary" id="bNew">+ Точка</button>
    <button id="bSpheres">Сферы</button>
    <button id="hideDone" class="quiet" aria-pressed="false">Скрыть сделанное</button>
  </div>
</header>

<section class="strip" aria-label="Сводка">
  <span><b id="sOpen">—</b>в пути</span>
  <span class="ok"><b id="sDone">—</b>сделано</span>
  <span class="rich"><b id="sRich">—</b>богатых точек</span>
  <span><b id="sPend">—</b>ждут сверки с Notion</span>
</section>

<main class="main">
  <div class="field" id="field">
    <svg id="svg" role="img" aria-label="Карта сфер и точек"></svg>
    <div class="banner" id="banner" hidden></div>
    <div class="keys" aria-hidden="true">
      <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="var(--star)"/></svg>в пути</span>
      <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="var(--done)"/></svg>сделано</span>
      <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="3" fill="var(--impulse)"/></svg>ждёт сверки</span>
      <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="var(--impulse)" stroke-width="1.6"/></svg>богатая точка</span>
      <span>тяните точку — она остаётся там, где вы её оставили</span>
    </div>
  </div>
  <aside class="side" id="side" aria-live="polite"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const DEFAULT_SPHERES=["Психопрактика","Призма","Меркор-ПРУФ","Творчество","ИИ и технологии","Обучение","Контент","Финансы","Личное","Хобби"];
const today=new Date(); const TODAY=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
let db=null, nodes=[], spheres=DEFAULT_SPHERES.slice(), selected=null, mode=null, linkFrom=null, hideDone=false, flash=null, ready=false, readOnly=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>d?d.split("-").reverse().join("."):"—";
const short=(s,n)=>{s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s};
const sphColor=s=>{const i=spheres.indexOf(s);return i<0?"var(--muted)":`var(--s${(i%10)+1})`};
const byId=id=>nodes.find(n=>n.id===id);
const linksOf=n=>{const out=new Set(n.links||[]);nodes.forEach(m=>{if((m.links||[]).includes(n.id))out.add(m.id)});out.delete(n.id);return [...out].filter(byId)};
const isRich=n=>(n.spheres||[]).length>=2||linksOf(n).some(id=>{const m=byId(id);return m&&!(m.spheres||[]).some(s=>(n.spheres||[]).includes(s))});
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)/4294967295};

/* --- хранилище --- */
async function writeNode(id,data){ if(readOnly)return;
  const go=()=>db.collection("nodes").doc(id).update({...data,updatedAt:new Date().toISOString()});
  try{ await go(); }
  catch(e){ if(e&&e.code==="unavailable"){try{await new Promise(r=>setTimeout(r,400+Math.random()*600));await go();return}catch(e2){e=e2}}
    flash={err:dbErr(e)}; renderSide(); }
}
function dbErr(e){const c=e&&e.code;
  if(c==="quota_exceeded")return"Хранилище карты заполнено: удалите лишние точки.";
  if(c==="invalid_argument")return"Точка не найдена или запись слишком велика — обновите страницу.";
  if(c==="resource_exhausted")return"Слишком часто — подождите пару секунд.";
  if(c==="revoked")return"Доступ к карте отозван — обновите страницу.";
  return"Не сохранилось ("+(c||"ошибка")+"). Попробуйте ещё раз.";}

/* --- карта --- */
let geo=null;
function render(){
  const open=nodes.filter(n=>n.status!=="done");
  $("sOpen").textContent=ready?open.length:"—"; $("sDone").textContent=ready?nodes.length-open.length:"—";
  $("sRich").textContent=ready?open.filter(isRich).length:"—"; $("sPend").textContent=ready?nodes.filter(n=>n.sync==="pending").length:"—";
  const svg=d3.select("#svg"); svg.selectAll("*").remove();
  const box=$("field").getBoundingClientRect(), W=Math.max(340,box.width), H=Math.max(480,box.height);
  const cx=W/2, cy=H/2-10, R=Math.min(W,H)*0.40; geo={cx,cy,R};
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  const g=svg.append("g");
  const zoom=d3.zoom().scaleExtent([.5,3]).filter(e=>!e.target.closest||!e.target.closest(".node")).on("zoom",e=>g.attr("transform",e.transform));
  svg.call(zoom).on("dblclick.zoom",null);
  svg.on("click",e=>{if(e.target===svg.node()&&mode!=="link"){selected=null;render();renderSide()}});
  [R*0.35,R*0.7,R*1.02].forEach(r=>g.append("circle").attr("class","orbit").attr("cx",cx).attr("cy",cy).attr("r",r));
  const used=spheres.filter(s=>true), n=Math.max(1,used.length), ang=i=>-Math.PI/2+i*2*Math.PI/n;
  if(n>1)used.forEach((s,i)=>{const a=ang(i)+Math.PI/n;g.append("line").attr("class","sector").attr("x1",cx+Math.cos(a)*R*0.18).attr("y1",cy+Math.sin(a)*R*0.18).attr("x2",cx+Math.cos(a)*R*1.08).attr("y2",cy+Math.sin(a)*R*1.08)});
  used.forEach((s,i)=>{const a=ang(i), lx=cx+Math.cos(a)*R*1.05, ly=cy+Math.sin(a)*R*1.05;
    g.append("text").attr("class","sph-name").attr("x",lx).attr("y",ly+(Math.sin(a)>.5?18:Math.sin(a)<-.5?-8:5))
      .attr("text-anchor",Math.abs(Math.cos(a))<.25?"middle":(Math.cos(a)>0?"start":"end")).attr("fill",sphColor(s)).text(s)});
  const visible=nodes.filter(m=>!(hideDone&&m.status==="done"));
  if(ready&&!nodes.length)g.append("text").attr("class","center-hint").attr("x",cx).attr("y",cy).attr("text-anchor","middle").text("Нажмите «+ Точка»");
  /* позиции: сохранённые — как есть, новые — в своём секторе */
  const anchor=s=>{const i=used.indexOf(s);if(i<0)return{x:cx,y:cy};return{x:cx+Math.cos(ang(i))*R*0.62,y:cy+Math.sin(ang(i))*R*0.62}};
  const P=visible.map(m=>{const sp=(m.spheres||[]).filter(s=>used.includes(s));
    const a=sp.length?{x:d3.mean(sp,s=>anchor(s).x),y:d3.mean(sp,s=>anchor(s).y)}:{x:cx,y:cy};
    if(typeof m.x==="number"&&typeof m.y==="number")return{m,x:cx+m.x*R,y:cy+m.y*R,fx:cx+m.x*R,fy:cy+m.y*R};
    const h=hash(m.id);return{m,x:a.x+(h-.5)*60,y:a.y+(hash(m.id+"y")-.5)*60,ax:a.x,ay:a.y}});
  const free=P.filter(p=>p.fx===undefined);
  if(free.length){const s=d3.forceSimulation(P).force("x",d3.forceX(d=>d.ax??d.x).strength(.12)).force("y",d3.forceY(d=>d.ay??d.y).strength(.12))
      .force("c",d3.forceCollide(34)).stop();for(let i=0;i<160;i++)s.tick();}
  const pos=new Map(P.map(p=>[p.m.id,p]));
  /* связи */
  const E=[];visible.forEach(m=>(m.links||[]).forEach(t=>{if(pos.has(t))E.push({a:pos.get(m.id),b:pos.get(t),rich:!(m.spheres||[]).some(s=>(byId(t).spheres||[]).includes(s))})}));
  g.append("g").selectAll("line").data(E).join("line").attr("class",d=>"edge"+(d.rich?" rich":""))
    .attr("x1",d=>d.a.x).attr("y1",d=>d.a.y).attr("x2",d=>d.b.x).attr("y2",d=>d.b.y);
  /* точки */
  const node=g.append("g").selectAll("g").data(P).join("g").attr("class","node").attr("transform",d=>`translate(${d.x},${d.y})`)
    .style("cursor",mode==="link"?"crosshair":"grab").attr("tabindex",0).attr("role","button").attr("aria-label",d=>d.m.title)
    .on("keydown",(e,d)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap(d.m.id)}});
  node.append("title").text(d=>d.m.title);
  node.filter(d=>d.m.status!=="done"&&isRich(d.m)).append("circle").attr("r",19).attr("fill","var(--impulse)").attr("class","pulse");
  node.append("circle").attr("r",13).attr("fill","none").attr("stroke",d=>sphColor((d.m.spheres||[])[0])).attr("stroke-width",2.2);
  node.filter(d=>(d.m.spheres||[]).length>1).append("circle").attr("r",16.5).attr("fill","none").attr("stroke",d=>sphColor(d.m.spheres[1])).attr("stroke-width",1.4).attr("stroke-dasharray","3 3");
  node.append("circle").attr("r",8).attr("fill",d=>d.m.status==="done"?"var(--done)":"var(--star)");
  node.filter(d=>d.m.sync==="pending").append("circle").attr("cx",10).attr("cy",-10).attr("r",4).attr("fill","var(--impulse)");
  node.filter(d=>d.m.sync==="synced").append("text").attr("x",7).attr("y",-6).attr("font-size",11).attr("fill","var(--done)").text("✓");
  node.filter(d=>d.m.sync==="not_found").append("text").attr("x",7).attr("y",-6).attr("font-size",11).attr("fill","var(--late)").text("?");
  node.filter(d=>d.m.id===selected||d.m.id===linkFrom).append("circle").attr("r",22).attr("fill","none").attr("stroke","var(--impulse)").attr("stroke-width",2);
  node.append("text").attr("class",d=>"n-label"+(d.m.status==="done"?" done":"")).attr("x",d=>d.m.id===selected||d.m.id===linkFrom?28:22).attr("y",4).text(d=>short(d.m.title,d.m.id===selected?60:30));
  /* перетаскивание: короткий жест — выбор, длинный — перенос */
  let moved=false;
  node.call(d3.drag().on("start",()=>{moved=false})
    .on("drag",function(e,d){moved=true;d.x=e.x;d.y=e.y;d3.select(this).attr("transform",`translate(${d.x},${d.y})`)})
    .on("end",function(e,d){ if(!moved){tap(d.m.id);return}
      if(readOnly){render();return}
      const nx=(d.x-cx)/R, ny=(d.y-cy)/R; writeNode(d.m.id,{x:+nx.toFixed(4),y:+ny.toFixed(4)}); }));
  $("banner").hidden=mode!=="link";
  if(mode==="link")$("banner").innerHTML=`Кликните точку, которую связать с «${esc(short(byId(linkFrom)?.title,30))}» <button id="bLinkCancel">Отмена</button>`;
  const bc=$("bLinkCancel"); if(bc)bc.onclick=()=>{mode=null;linkFrom=null;render();renderSide()};
}
function tap(id){
  if(mode==="link"&&linkFrom){
    if(id!==linkFrom){const a=byId(linkFrom), b=byId(id);
      const linked=linksOf(a).includes(id);
      if(linked){ writeNode(a.id,{links:(a.links||[]).filter(x=>x!==id)}); writeNode(b.id,{links:(b.links||[]).filter(x=>x!==a.id)}); flash={ok:"Связь снята."}; }
      else{ writeNode(a.id,{links:[...(a.links||[]),id]}); flash={ok:"Связь проведена."}; }
    }
    mode=null; selected=linkFrom; linkFrom=null; render(); renderSide(); return;
  }
  selected=id; flash=null; render(); renderSide();
}

/* --- пульт --- */
function sphChips(list){return `<div class="chips">${(list||[]).map(s=>`<span class="chip"><i style="background:${sphColor(s)}"></i>${esc(s)}</span>`).join("")}</div>`}
function syncLine(n){
  if(n.sync==="pending")return'<span class="chip run">ждёт сверки с Notion</span>';
  if(n.sync==="synced")return`<span class="chip done">сверено с Notion</span>${n.syncNote?` <span class="note">${esc(n.syncNote)}</span>`:""}`;
  if(n.sync==="not_found")return`<span class="chip late">в Notion не найдено</span>${n.syncNote?` <span class="note">${esc(n.syncNote)}</span>`:""}`;
  return"";
}
function nodeCard(n){
  const ls=linksOf(n).map(byId);
  return `<h2>Точка</h2><h3>${esc(n.title)}</h3>${sphChips(n.spheres)}
  <div>${n.status==="done"?`<span class="chip done">сделано ${fmt(n.doneAt)}</span>`:'<span class="chip">в пути</span>'} ${isRich(n)&&n.status!=="done"?'<span class="chip run">богатая</span>':""}</div>
  <div>${syncLine(n)}</div>
  ${n.note?`<p class="note">${esc(n.note)}</p>`:""}
  ${n.notion?`<a href="${esc(n.notion)}" target="_blank" rel="noopener">Открыть в Notion</a>`:""}
  <h2>Связи</h2>${ls.length?`<ul class="list">${ls.map(m=>`<li><button class="go" data-go="${esc(m.id)}"><span>${esc(m.title)}</span>${m.status==="done"?'<span class="chip done">✓</span>':""}</button></li>`).join("")}</ul>`:'<p class="note">Пока одна. Связь с точкой из другой сферы делает её богатой.</p>'}
  <div class="actions">
    ${n.status!=="done"?'<button class="primary" id="bDone">Готово</button>':'<button id="bUndo">Вернуть в путь</button>'}
    <button id="bLink">Связать</button><button id="bEdit">Изменить</button><button class="quiet danger" id="bDel">Удалить</button>
  </div><div id="slot"></div>
  <button class="quiet" id="bBack">← К обзору</button>`;
}
function overview(){
  const open=nodes.filter(n=>n.status!=="done").sort((a,b)=>(isRich(b)-isRich(a))||linksOf(b).length-linksOf(a).length);
  const pend=nodes.filter(n=>n.sync==="pending"), nf=nodes.filter(n=>n.sync==="not_found");
  if(ready&&!nodes.length)return `<h2>Начало</h2><p class="note">Это ваша карта, а не выгрузка из Notion. Ставьте только крупное: цели, узлы, проекты, ради которых вы садитесь работать.</p>
    <ol class="note" style="margin:0;padding-left:18px"><li>«+ Точка» — название и сфера.</li><li>Тяните точку куда удобно — место запомнится.</li><li>«Связать» — от точки к точке; связь через сферы = богатый узел.</li><li>«Готово» — когда мост сожжён. Архитектор сверит с Notion и закроет там.</li></ol>`;
  return `<h2>Куда дальше</h2>${open.length?`<ul class="list">${open.slice(0,5).map(m=>`<li><button class="go" data-go="${esc(m.id)}"><span>${esc(m.title)}</span>${isRich(m)?'<span class="chip run">богатая</span>':""}</button></li>`).join("")}</ul>`:'<p class="note">Всё отмечено. Самое время поставить новую точку.</p>'}
  <h2>Ждут сверки с Notion</h2>${pend.length?`<ul class="list">${pend.map(m=>`<li><button class="go" data-go="${esc(m.id)}"><span>${esc(m.title)}</span><span class="chip run">${fmt(m.doneAt)}</span></button></li>`).join("")}</ul>
    <p class="note">Скажите Архитектору: «сверь карту». Он найдёт эти точки в Notion, закроет, что не закрыто, и поставит ✓.</p>`:'<p class="note">Расхождений нет.</p>'}
  ${nf.length?`<h2>Не нашлось в Notion</h2><ul class="list">${nf.map(m=>`<li><button class="go" data-go="${esc(m.id)}"><span>${esc(m.title)}</span><span class="chip late">?</span></button></li>`).join("")}</ul>`:""}`;
}
function nodeForm(n){
  const sel=new Set(n?n.spheres||[]:[]);
  return `<form class="form" id="nodeForm"><h2>${n?"Изменить точку":"Новая точка"}</h2>
   <label class="t" for="fTitle">Что это</label><input type="text" id="fTitle" maxlength="140" value="${esc(n?n.title:"")}" placeholder="Например: колода Felt Sense в печать">
   <span class="t">Сферы (одна или несколько)</span>
   <div class="chips">${spheres.map((s,i)=>`<label><input type="checkbox" name="sph" value="${esc(s)}" ${sel.has(s)?"checked":""}><i style="width:8px;height:8px;border-radius:50%;background:${sphColor(s)}"></i>${esc(s)}</label>`).join("")}</div>
   <label class="t" for="fNotion">Ссылка на Notion — необязательно, без неё Архитектор найдёт по названию</label><input type="url" id="fNotion" value="${esc(n?n.notion||"":"")}" placeholder="https://app.notion.com/p/…">
   <label class="t" for="fNote">Заметка</label><textarea id="fNote" maxlength="600">${esc(n?n.note||"":"")}</textarea>
   <span class="err-inline" id="fErr"></span>
   <div class="actions"><button class="primary" type="submit">${n?"Сохранить":"Поставить на карту"}</button><button class="quiet" type="button" id="fCancel">Отмена</button></div></form>`;
}
function spheresForm(){
  return `<form class="form" id="sphForm"><h2>Сферы карты</h2><p class="note">По одной в строке. Порядок — порядок секторов по часовой стрелке. Точки сферы, которую вы уберёте, встанут в центр.</p>
   <textarea id="sphList" rows="10">${esc(spheres.join("\n"))}</textarea><span class="err-inline" id="sErr"></span>
   <div class="actions"><button class="primary" type="submit">Сохранить</button><button class="quiet" type="button" id="sCancel">Отмена</button></div></form>`;
}
let panel=null;
function renderSide(){
  let h=flash?`<div class="msg ${flash.err?"err":"ok"}">${esc(flash.err||flash.ok)}</div>`:"";
  if(!db&&ready){h+=`<h2>Карта недоступна</h2><p class="note">Эта копия страницы не может хранить точки. Откройте артефакт «Синапсы» в claude.ai.</p>`;$("side").innerHTML=h;return}
  if(!ready){h+='<p class="note">Загружаю карту…</p>';$("side").innerHTML=h;return}
  if(panel==="new")h+=nodeForm(null); else if(panel==="edit"&&byId(selected))h+=nodeForm(byId(selected)); else if(panel==="spheres")h+=spheresForm();
  else{const n=byId(selected); h+= n?nodeCard(n):overview();}
  $("side").innerHTML=h; wire();
}
function wire(){
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};
  document.querySelectorAll("#side [data-go]").forEach(b=>b.onclick=()=>{selected=b.dataset.go;panel=null;flash=null;render();renderSide()});
  on("bBack",()=>{selected=null;flash=null;render();renderSide()});
  const n=byId(selected);
  on("bDone",()=>{$("slot").innerHTML=`<div class="confirm"><b>Мост сожжён?</b><span>Готово — когда назад не отыграть: отправлено, показано, сдано, опубликовано.</span>
    <div class="actions"><button class="primary" id="bYes">Да, готово</button><button class="quiet" id="bNo">Ещё нет</button></div></div>`;
    on("bNo",()=>{$("slot").innerHTML=""});
    on("bYes",async()=>{await writeNode(n.id,{status:"done",doneAt:TODAY,sync:"pending",syncNote:""});flash={ok:"Мост сожжён. Точка ждёт сверки с Notion."};selected=null;renderSide()});});
  on("bUndo",()=>writeNode(n.id,{status:"open",doneAt:"",sync:n.sync==="synced"?"synced":"none"}));
  on("bLink",()=>{mode="link";linkFrom=n.id;render()});
  on("bEdit",()=>{panel="edit";renderSide()});
  on("bDel",()=>{$("slot").innerHTML=`<div class="confirm"><b>Удалить точку «${esc(short(n.title,40))}»?</b><span>Связи с ней тоже исчезнут. В Notion ничего не изменится.</span>
    <div class="actions"><button class="danger" id="bDelYes">Удалить</button><button class="quiet" id="bDelNo">Оставить</button></div></div>`;
    on("bDelNo",()=>{$("slot").innerHTML=""});
    on("bDelYes",async()=>{try{for(const m of nodes)if((m.links||[]).includes(n.id))await writeNode(m.id,{links:m.links.filter(x=>x!==n.id)});
      await db.collection("nodes").doc(n.id).delete();selected=null;flash={ok:"Точка удалена."}}catch(e){flash={err:dbErr(e)}}renderSide()});});
  const f=$("nodeForm");
  if(f){on("fCancel",()=>{panel=null;renderSide()});
    f.onsubmit=async e=>{e.preventDefault();const title=$("fTitle").value.trim();const sp=[...f.querySelectorAll("input[name=sph]:checked")].map(x=>x.value);
      const notion=$("fNotion").value.trim(), note=$("fNote").value.trim();
      if(!title){$("fErr").textContent="Назовите точку.";return} if(!sp.length){$("fErr").textContent="Выберите хотя бы одну сферу.";return}
      if(notion&&!/^https:\/\/(app\.notion\.com|www\.notion\.so|notion\.so)\//.test(notion)){$("fErr").textContent="Ссылка должна вести в Notion.";return}
      try{ if(panel==="edit"){await writeNode(selected,{title,spheres:sp,notion,note});flash={ok:"Сохранено."}}
        else{const ref=await db.collection("nodes").add({title,spheres:sp,notion,note,status:"open",doneAt:"",links:[],sync:"none",syncNote:"",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});selected=ref.id;flash={ok:"Точка на карте. Тяните её, куда удобно."}}
        panel=null;renderSide();}catch(err){$("fErr").textContent=dbErr(err)}};
    ["fTitle","fNotion"].forEach(id=>$(id).oninput=()=>{$("fErr").textContent=""});}
  const sf=$("sphForm");
  if(sf){on("sCancel",()=>{panel=null;renderSide()});
    sf.onsubmit=async e=>{e.preventDefault();const list=[...new Set($("sphList").value.split("\n").map(s=>s.trim()).filter(Boolean))];
      if(!list.length){$("sErr").textContent="Нужна хотя бы одна сфера.";return} if(list.length>16){$("sErr").textContent="Не больше 16 сфер — иначе круг не читается.";return}
      try{await db.doc("meta/spheres").set({list,updatedAt:new Date().toISOString()});panel=null;flash={ok:"Сферы сохранены."};renderSide()}catch(err){$("sErr").textContent=dbErr(err)}};}
}
$("bNew").onclick=()=>{if(!db)return;panel="new";selected=null;renderSide();setTimeout(()=>{const t=$("fTitle");if(t)t.focus()},0)};
$("bSpheres").onclick=()=>{if(!db)return;panel="spheres";renderSide()};
$("hideDone").onclick=e=>{hideDone=!hideDone;e.currentTarget.setAttribute("aria-pressed",hideDone);render()};
let rs;addEventListener("resize",()=>{clearTimeout(rs);rs=setTimeout(render,200)});
render(); renderSide();
(async()=>{
  try{db=window.claude?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){ready=true;render();renderSide();["bNew","bSpheres"].forEach(id=>$(id).disabled=true);return}
  db.doc("meta/spheres").onSnapshot(s=>{const l=s.exists&&s.data().list;spheres=Array.isArray(l)&&l.length?l.slice():DEFAULT_SPHERES.slice();render();if(panel!=="spheres")renderSide()},e=>{flash={err:dbErr(e)};renderSide()});
  db.collection("nodes").onSnapshot(s=>{nodes=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;
      if(selected&&!byId(selected))selected=null; render(); if(!panel)renderSide();},
    e=>{ready=true;flash={err:dbErr(e)};render();renderSide()});
})();
</script>
